id: agents-ia
titre: Agents IA et automatisation
description: >-
  Agents LLM, Claude, MCP, outils d'automatisation (n8n, scripts, pipelines).
  Les vidéos que les développeurs se recommandent entre eux.
# Le domaine bouge vite : une recommandation de deux ans pèse quatre fois moins qu'une récente.
demi_vie_mois: 12
# Avant 2023, « agent » désigne surtout autre chose (agents logiciels classiques, RL).
depuis: 2023-01-01
mots_cles:
  - agent
  - agents
  - agentic
  - LLM
  - Claude
  - MCP
  - Anthropic
  - automation
  - n8n
  - prompt
  - RAG
consigne_classement: >-
  Vidéo sur les agents IA, les LLM appliqués, Claude, MCP, ou l'automatisation de tâches par
  logiciel. Hors sujet : actualité IA générale sans contenu pratique, musique, divertissement.
# Le subreddit fait office de filtre thématique : toutes les vidéos qui y sont citées comptent.
reddit:
  # Les trois premiers sont trop actifs pour suivre leurs commentaires chaque semaine : posts seuls.
  subreddits:
    - {nom: ClaudeAI, types: [posts]}
    - {nom: AI_Agents, types: [posts]}
    - {nom: LocalLLaMA, types: [posts]}
    - n8n
