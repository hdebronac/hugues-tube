name: Site

on:
  # Chaque lundi : nouvelle collecte, classement des nouvelles mentions, publication.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tube/**", "interests/**", "site/**", ".github/workflows/site.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[claude,dev]"
      - run: python -m pytest -q
      # Sur un push de code, pas de nouvelle collecte : on reclasse et on republie à partir de data/.
      - name: Chaîne complète
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m tube ${{ github.event_name == 'push' && 'site' || 'tout' }}
      - name: Versionner les données
        run: |
          git config user.name "hugues-tube"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: collecte du $(date -u +%F)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
