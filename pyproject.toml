[project]
name = "hugues-tube"
version = "0.1.0"
description = "Les vidéos YouTube que les passionnés se recommandent, par centre d'intérêt."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Disposition à plat avec plusieurs dossiers à la racine (site/, data/, tests/) : sans liste
# explicite, setuptools refuse de deviner le paquet.
[tool.setuptools]
packages = ["tube"]
